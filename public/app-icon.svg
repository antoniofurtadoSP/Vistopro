<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B2240" />
    </linearGradient>

    <!-- Gold Gradients for Column -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#FFF8DC" />
      <stop offset="80%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- Navy Letter Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Base Background (Dark Navy Luxury) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.4" />

  <!-- Center Group -->
  <g transform="translate(0, 10)">
    
    <!-- GOLDEN ROMAN/GREEK COLUMN -->
    <g id="column" filter="url(#shadow)">
      <!-- Capital Top Scroll (Ionic Order) -->
      <path d="M 200 110 C 180 110 170 90 185 80 C 195 72 215 82 205 98 C 200 102 195 102 192 98" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 312 110 C 332 110 342 90 327 80 C 317 72 297 82 307 98 C 312 102 317 102 320 98" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
      <rect x="180" y="70" width="152" height="14" rx="4" fill="url(#goldCapGrad)" />
      <path d="M 195 84 L 317 84 L 305 110 L 207 110 Z" fill="url(#goldGrad)" />
      <rect x="200" y="110" width="112" height="10" rx="2" fill="url(#goldCapGrad)" />

      <!-- Column Shaft Flutes (Vertical Gold Bars) -->
      <rect x="210" y="125" width="92" height="270" rx="3" fill="url(#goldGrad)" />
      <!-- Flute shadows for 3D effect -->
      <line x1="222" y1="125" x2="222" y2="395" stroke="#8B6508" stroke-width="3" opacity="0.6"/>
      <line x1="238" y1="125" x2="238" y2="395" stroke="#FFF8DC" stroke-width="2" opacity="0.8"/>
      <line x1="256" y1="125" x2="256" y2="395" stroke="#8B6508" stroke-width="3" opacity="0.5"/>
      <line x1="274" y1="125" x2="274" y2="395" stroke="#FFF8DC" stroke-width="2" opacity="0.8"/>
      <line x1="290" y1="125" x2="290" y2="395" stroke="#8B6508" stroke-width="3" opacity="0.6"/>

      <!-- Base Bottom -->
      <rect x="198" y="395" width="116" height="12" rx="3" fill="url(#goldCapGrad)" />
      <rect x="186" y="407" width="140" height="16" rx="4" fill="url(#goldGrad)" />
    </g>

    <!-- MONOGRAM LETTERS 'A' & 'F' (NAVY & GOLD EMBOSSED) -->
    <!-- 'A' Letter -->
    <path d="M 140 410 L 230 140 L 280 140 L 220 410 Z" fill="#1E3A8A" stroke="#FFD700" stroke-width="4" filter="url(#shadow)" />
    <path d="M 180 300 L 310 300 L 300 335 L 165 335 Z" fill="#1E3A8A" stroke="#FFD700" stroke-width="3" />

    <!-- 'F' Letter (Entwined with Column and 'A') -->
    <path d="M 270 140 L 390 140 L 385 180 L 315 180 L 310 250 L 370 250 L 365 288 L 305 288 L 290 410 L 250 410 L 275 288 Z" fill="#0B2240" stroke="#FFD700" stroke-width="4" filter="url(#shadow)" />

    <!-- Serif Accents on A and F -->
    <path d="M 125 410 L 175 410" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />
    <path d="M 365 140 L 400 140" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
